<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Monster Chess 3D - War of Elements</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#44205e,#160e29 65%,#090b18);color:white;font-family:Cairo,Arial,sans-serif;text-align:center;min-height:100vh;}
header{padding:20px 10px 12px;background:linear-gradient(135deg,#301647,#17132c);border-bottom:2px solid #d4af37;box-shadow:0 5px 25px #0009;}
h1{margin:0;font-size:clamp(23px,6vw,38px);color:#ffd66b;text-shadow:0 0 15px #ffba35;}
.subtitle{color:#d8b7f0;font-size:13px;}
.section{width:min(95%,850px);margin:22px auto;padding:20px 14px;border:1px solid #a77bba66;border-radius:22px;background:linear-gradient(145deg,#ffffff12,#ffffff04);box-shadow:0 10px 35px #0007,inset 0 0 20px #9b59b622;}
.section-title{color:#ffd66b;font-size:18px;font-weight:900;margin:10px 0 18px;text-shadow:0 0 10px #d4af37;}
.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;}
.btn{position:relative;overflow:hidden;cursor:pointer;border:2px solid #f3d06e;border-radius:13px;min-width:135px;padding:13px 18px;color:white;font-family:inherit;font-weight:900;font-size:15px;text-shadow:0 2px 4px #0009;box-shadow:inset 0 3px 5px #ffffff66,inset 0 -5px 8px #0007,0 6px 12px #0008;transition:.15s;}
.btn:before{content:"";position:absolute;top:0;left:10%;width:80%;height:45%;background:linear-gradient(#ffffff55,transparent);border-radius:0 0 50% 50%;pointer-events:none;}
.btn:active{transform:translateY(4px);box-shadow:inset 0 3px 8px #0009;}
.gold{background:linear-gradient(#ffe477,#c18b16,#80530a);color:#402500}
.green{background:linear-gradient(#42e99a,#17945b,#07502f)}
.purple{background:linear-gradient(#c37ad7,#7435a4,#38145d)}
.blue{background:linear-gradient(#55baff,#2377b9,#12416e)}
.red{background:linear-gradient(#ff6868,#c52727,#750c0c)}
.orange{background:linear-gradient(#ffb34a,#ce600e,#753000)}
.large{width:min(90%,340px);padding:18px;font-size:22px;border-radius:35px;}
.small{min-width:110px;font-size:13px;padding:10px}
#gameScreen{display:none}
#game{width:100%;height:65vh;min-height:400px;max-height:800px;touch-action:none;overflow:hidden;border-radius:15px;}
#game canvas{display:block}
.game-panel{width:min(96%,800px);margin:15px auto;padding:13px;background:#211632;border:1px solid #a77bba77;border-radius:18px;}
#status{color:#8ee7ff;font-weight:900;font-size:16px;margin:10px;}
#moves{max-height:65px;overflow:auto;color:#ddd;font-size:12px;overflow-wrap:anywhere;margin-top:12px;}
select{background:#302044;color:white;border:1px solid #d4af37;border-radius:10px;padding:10px;font-family:inherit;font-weight:bold;}
#promotion{display:none;padding:12px;background:#37244d;border-radius:12px;margin:10px;}
#settings{display:none;position:fixed;inset:0;z-index:10;background:#000b;justify-content:center;align-items:center;padding:15px;}
.modal{width:min(95%,400px);background:linear-gradient(145deg,#49245e,#1a102b);border:2px solid #d4af37;border-radius:20px;padding:22px;box-shadow:0 0 35px #000;}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff22;}
input[type=checkbox]{width:22px;height:22px;accent-color:#d4af37}
#notice{color:#ffd66b;min-height:25px;font-size:13px;margin:8px;}
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;opacity:1;transition:opacity 1s ease;}
#splash.hide{opacity:0;pointer-events:none;}
#splash .splash-vignette{position:absolute;inset:0;background:radial-gradient(circle at center,#2a1245 0%,#0a0512 55%,#000 100%);}
#splash .splash-rays{position:absolute;width:150vmax;height:150vmax;background:conic-gradient(from 0deg,transparent 0deg,rgba(255,214,107,0.12) 15deg,transparent 30deg,transparent 90deg,rgba(255,214,107,0.09) 105deg,transparent 120deg,transparent 180deg,rgba(255,214,107,0.12) 195deg,transparent 210deg,transparent 270deg,rgba(255,214,107,0.09) 285deg,transparent 300deg);opacity:0;animation:raysIn 1.6s ease 0.3s forwards, spin 22s linear infinite;}
@keyframes raysIn{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.company-wrap{position:relative;z-index:2;display:flex;justify-content:center;}
#splash .company{margin:0;font-size:clamp(48px,15vw,120px);font-weight:900;letter-spacing:16px;padding:0 10px;background:linear-gradient(180deg,#fff8d8 0%,#ffd66b 30%,#8a5c04 50%,#ffd66b 70%,#fff8d8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;opacity:0;transform:scale(0.4);filter:blur(14px) drop-shadow(0 0 30px #ffba35aa) drop-shadow(0 0 60px #d4af3766);animation:companyIn 1.4s cubic-bezier(.2,.9,.3,1.1) 0.2s forwards;}
@keyframes companyIn{0%{opacity:0;transform:scale(0.4);filter:blur(14px);}60%{opacity:1;transform:scale(1.08);filter:blur(0);}100%{opacity:1;transform:scale(1);filter:blur(0);}}
.company-shine{position:absolute;top:0;left:-100%;width:55%;height:100%;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,0.9) 50%,transparent 80%);mix-blend-mode:overlay;pointer-events:none;animation:shine 2.6s ease 1.6s infinite;}
@keyframes shine{0%{left:-100%;}40%{left:150%;}100%{left:150%;}}
#splash .tagline{margin-top:22px;color:#e8d4ff;font-size:clamp(11px,3vw,16px);font-weight:700;letter-spacing:14px;opacity:0;transform:translateY(10px);z-index:2;animation:tagIn 0.9s ease 1.4s forwards;}
@keyframes tagIn{to{opacity:1;transform:translateY(0);}}
.splash-loader{margin-top:38px;width:180px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;z-index:2;opacity:0;animation:tagIn 0.6s ease 1.8s forwards;}
.splash-loader > div{width:0;height:100%;background:linear-gradient(90deg,#ffd66b,#fff8d8);box-shadow:0 0 10px #ffd66b;animation:load 1.4s ease 1.9s forwards;}
@keyframes load{to{width:100%;}}
</style>
</head>

<body>

<div id="splash">
 <div class="splash-vignette"></div>
 <div class="splash-rays"></div>
 <div class="company-wrap">
   <div class="company">KOKTON</div>

 </div>

<h1>🐉 MONSTER CHESS 3D</h1>

<div id="menuScreen">

<div style="font-size:65px;margin:10px">🗿 🔥 🐘</div>

<div class="section">

<div class="buttons">
<button class="btn gold small" onclick="openSettings()">⚙️ الإعدادات</button>
<button class="btn gold small" onclick="comingSoon('الإنجازات')">🏅 الإنجازات</button>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "chess":"https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm"
 }
}
</script>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {Chess} from "chess";

const chess=new Chess();
const holder=document.getElementById("game");

let selected=null;
let thinking=false;
let pendingPromotion=null;
let snapshots=[];
let gameStarted=false;
let initialized=false;
let animatedPieces = []; // مصفوفة لتخزين الوحوش لتحريكها

const files="abcdefgh";

function position(square){
 return {
  x:(files.indexOf(square[0])-3.5)*3.2,
  z:(Number(square[1])-4.5)*3.2
 };
}

function sound(){
 if(!document.getElementById("sound").checked)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  const ctx=new AC();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.frequency.value=650;
  gain.gain.setValueAtTime(.07,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.12);
  osc.start(); osc.stop(ctx.currentTime+.12);
  osc.onended=()=>{try{ctx.close();}catch(e){}};
 }catch(e){}
}

function notice(msg){ document.getElementById("notice").textContent=msg; }
window.comingSoon=function(name){ sound(); notice("✨ "+name+" - قريباً في تحديث جديد!"); };
window.openSettings=function(){ sound(); document.getElementById("settings").style.display="flex"; };
window.closeSettings=function(){ sound(); document.getElementById("settings").style.display="none"; };

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x151126);
scene.fog=new THREE.FogExp2(0x151126, 0.012);

const camera=new THREE.PerspectiveCamera(45,1,.1,1000);
camera.position.set(25,30,35);

const renderer=new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
holder.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true;
controls.enablePan=false;
controls.minDistance=18;
controls.maxDistance=50;
controls.maxPolarAngle=Math.PI/2.15;

// إضاءة محيطة
scene.add(new THREE.HemisphereLight(0xffffff,0x303040,2));

// ضوء الشمس
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(15,30,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -35;
sun.shadow.camera.right = 35;
sun.shadow.camera.top = 35;
sun.shadow.camera.bottom = -35;
scene.add(sun);

// أرضية
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshStandardMaterial({color:0x101020}));
floor.rotation.x=-Math.PI/2;
floor.position.y=-1.2;
scene.add(floor);

// قاعدة الشطرنج
const base=new THREE.Mesh(new THREE.BoxGeometry(28,1,28), new THREE.MeshStandardMaterial({ color:0x29213e, metalness:.5, roughness:.35 }));
base.position.y=-.7;
base.receiveShadow=true;
scene.add(base);

const board=new THREE.Group();
scene.add(board);
const pieces=new THREE.Group();
scene.add(pieces);
const squares=[];

function makeBoard(){
 for(let rank=8;rank>=1;rank--){
  for(let f=0;f<8;f++){
   const s=files[f]+rank;
   const p=position(s);
   const mat=new THREE.MeshStandardMaterial({ color:(rank+f)%2?0x936343:0xe9d2a5, roughness:.8 });
   const mesh=new THREE.Mesh(new THREE.BoxGeometry(3.1,.2,3.1), mat);
   mesh.position.set(p.x,-.2,p.z);
   mesh.receiveShadow=true;
   mesh.userData.square=s;
   board.add(mesh);
   squares.push(mesh);
  }
 }
}

// ==========================================
// تصميم الوحوش (النسخة الملحمية - إضافة الروح)
// ==========================================
function monster(type,color){
 const g=new THREE.Group();
 const isWhite = color === "w";
 
 // خامات
 const stoneColor = isWhite ? 0x8899aa : 0x331111;
 const stoneMat = new THREE.MeshStandardMaterial({ color: stoneColor, roughness: 0.8, flatShading: true });
 
 // نار
 const fireColor = isWhite ? 0xffaa00 : 0xff1100;
 const fireMat = new THREE.MeshStandardMaterial({ color: fireColor, emissive: fireColor, emissiveIntensity: 2, roughness: 0.2, flatShading: true });
 
 // ذهب/معدن
 const goldMat = new THREE.MeshStandardMaterial({ color: isWhite ? 0xffd700 : 0x880000, metalness: 0.9, roughness: 0.1 });
 
 // عيون
 const eyeColor = isWhite ? 0x00ffff : 0xff0000;
 const eyeMat = new THREE.MeshBasicMaterial({ color: eyeColor });

 function addMesh(geo, mat, x, y, z, rx=0, ry=0, rz=0){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow = true; m.receiveShadow = true;
  g.add(m);
  return m;
 }

 // --- 1. الجندي (Pawn): صخري ---
 if(type==="p"){
  addMesh(new THREE.DodecahedronGeometry(0.7,0), stoneMat, 0, 0.7, 0); // جسم
  addMesh(new THREE.BoxGeometry(0.8,0.3,0.4), goldMat, 0, 0.5, 0.5); // درع
  addMesh(new THREE.SphereGeometry(0.08), eyeMat, -0.15, 1.1, 0.5);
  addMesh(new THREE.SphereGeometry(0.08), eyeMat, 0.15, 1.1, 0.5);
 }

 // --- 2. القلعة (Rook): وحش ضخم ---
 else if(type==="r"){
  addMesh(new THREE.BoxGeometry(1.8, 1.8, 1.6), stoneMat, 0, 1.2, 0); // جسم عريض
  addMesh(new THREE.BoxGeometry(1.2, 1, 1.2), stoneMat, 0, 2.5, 0); // رأس
  addMesh(new THREE.DodecahedronGeometry(0.9), stoneMat, -1.3, 1.8, 0); // كتف يسار
  addMesh(new THREE.DodecahedronGeometry(0.9), stoneMat, 1.3, 1.8, 0); // كتف يمين
  addMesh(new THREE.BoxGeometry(0.7, 1.4, 0.7), stoneMat, -1.5, 0.8, 0); // ذراع
  addMesh(new THREE.BoxGeometry(0.7, 1.4, 0.7), stoneMat, 1.5, 0.8, 0); // ذراع
  addMesh(new THREE.CylinderGeometry(0.8, 0.8, 0.4, 6), goldMat, 0, 3.1, 0); // تاج
  addMesh(new THREE.SphereGeometry(0.12), eyeMat, -0.25, 2.5, 0.6);
  addMesh(new THREE.SphereGeometry(0.12), eyeMat, 0.25, 2.5, 0.6);
  g.scale.set(1.4, 1.4, 1.4);
 }

 // --- 3. الوزير (Queen): لهب ناري ---
 else if(type==="q"){
  // قاعدة نارية عريضة
  addMesh(new THREE.CylinderGeometry(1, 1.5, 0.8, 8), fireMat, 0, 0.4, 0);
  // جسم ملتهب
  addMesh(new THREE.ConeGeometry(1, 2.5, 6), fireMat, 0, 2, 0); 
  // تاج من النار
  for(let i=0; i<6; i++){
   let x = Math.cos(i*Math.PI*2/6)*0.6;
   let z = Math.sin(i*Math.PI*2/6)*0.6;
   addMesh(new THREE.ConeGeometry(0.2, 1.2, 4), fireMat, x, 3.8, z);
  }
  addMesh(new THREE.SphereGeometry(0.1), eyeMat, -0.2, 2.2, 0.8);
  addMesh(new THREE.SphereGeometry(0.1), eyeMat, 0.2, 2.2, 0.8);
  
  // إضاءة نارية تنبعث من الوزير
  const light = new THREE.PointLight(fireColor, 3, 6);
  light.position.set(0, 2, 0);
  g.add(light);
  g.scale.set(1.3, 1.3, 1.3);
 }

 // --- 4. الملك (King): خوذة جحيمية ---
 else if(type==="k"){
  addMesh(new THREE.DodecahedronGeometry(1,0), stoneMat, 0, 1.2, 0); // جسم
  addMesh(new THREE.DodecahedronGeometry(0.6,0), stoneMat, 0, 2.4, 0); // رأس
  // خوذة
  addMesh(new THREE.SphereGeometry(0.7, 8, 8, 0, Math.PI*2, 0, Math.PI/2), goldMat, 0, 2.4, 0);
  // قرون جحيمية
  addMesh(new THREE.ConeGeometry(0.15, 1.2, 6), fireMat, -0.6, 3.1, 0, 0, 0, Math.PI/4);
  addMesh(new THREE.ConeGeometry(0.15, 1.2, 6), fireMat, 0.6, 3.1, 0, 0, 0, -Math.PI/4);
  // درع
  addMesh(new THREE.CylinderGeometry(0.9, 1, 0.8, 8, 1, false, 0, Math.PI), goldMat, 0, 1.3, 0.4, 0, Math.PI, 0);
  
  // إضاءة جحيمية
  const light = new THREE.PointLight(0xff2200, 2, 5);
  light.position.set(0, 2.5, 0);
  g.add(light);
 }

 // --- 5. الحصان (Knight): حصان صخري ---
 else if(type==="n"){
  addMesh(new THREE.BoxGeometry(0.8, 1, 1.4), stoneMat, 0, 1, 0); // جسم
  addMesh(new THREE.BoxGeometry(0.5, 1.4, 0.5), stoneMat, 0, 1.8, 0.5, -Math.PI/6, 0, 0); // رقبة
  addMesh(new THREE.BoxGeometry(0.5, 0.5, 1), stoneMat, 0, 2.4, 0.8, Math.PI/8, 0, 0); // رأس
  // عرف الحصان (أشواك)
  for(let i=0; i<3; i++) addMesh(new THREE.ConeGeometry(0.1, 0.4, 4), goldMat, 0, 1.8 + (i*0.2), 0.2, -Math.PI/4, 0, 0);
  // أرجل
  addMesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), stoneMat, -0.3, 0.4, 0.5);
  addMesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), stoneMat, 0.3, 0.4, 0.5);
  addMesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), stoneMat, -0.3, 0.4, -0.5);
  addMesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), stoneMat, 0.3, 0.4, -0.5);
  addMesh(new THREE.SphereGeometry(0.1), eyeMat, -0.2, 2.4, 1.2);
  addMesh(new THREE.SphereGeometry(0.1), eyeMat, 0.2, 2.4, 1.2);
 }

 // --- 6. الفيل (Bishop): ماموث ---
 else if(type==="b"){
  addMesh(new THREE.DodecahedronGeometry(1.2,0), stoneMat, 0, 1.3, 0); // جسم كبير
  addMesh(new THREE.DodecahedronGeometry(0.8,0), stoneMat, 0, 2.2, 0.8); // رأس
  addMesh(new THREE.CylinderGeometry(0.2, 0.1, 1.5, 5), stoneMat, 0, 1.6, 1.5, Math.PI/3, 0, 0); // خرطوم
  // أنياب
  addMesh(new THREE.ConeGeometry(0.1, 1, 5), goldMat, -0.4, 1.8, 1.4, Math.PI/2, 0, Math.PI/6);
  addMesh(new THREE.ConeGeometry(0.1, 1, 5), goldMat, 0.4, 1.8, 1.4, Math.PI/2, 0, -Math.PI/6);
  // آذان
  addMesh(new THREE.ConeGeometry(0.5, 0.1, 4), stoneMat, -0.8, 2.4, 0.6, 0, 0, Math.PI/4);
  addMesh(new THREE.ConeGeometry(0.5, 0.1, 4), stoneMat, 0.8, 2.4, 0.6, 0, 0, -Math.PI/4);
  addMesh(new THREE.SphereGeometry(0.1), eyeMat, -0.4, 2.3, 1.4);
  addMesh(new THREE.SphereGeometry(0.1), eyeMat, 0.4, 2.3, 1.4);
 }

 // إضافة الوحش لقائمة التحريك
 animatedPieces.push({mesh: g, offset: Math.random() * Math.PI * 2, type: type});
 return g;
}

function draw(){
 pieces.clear();
 animatedPieces = []; // تصفير القائمة عند كل حركة
 const state=chess.board();
 for(let r=0;r<8;r++){
  for(let f=0;f<8;f++){
   const p=state[r][f];
   if(!p)continue;
   const s=files[f]+(8-r);
   const pos=position(s);
   const obj=monster(p.type,p.color);
   obj.position.set(pos.x,-.1,pos.z);
   obj.userData.square=s;
   obj.userData.color=p.color;
   pieces.add(obj);
  }
 }
 pieces.updateMatrixWorld(true);
}

function resetColors(){
 squares.forEach(s=>{
  const rank=Number(s.userData.square[1]);
  const f=files.indexOf(s.userData.square[0]);
  s.material.color.setHex((rank+f)%2?0x936343:0xe9d2a5);
 });
}

function showMoves(from){
 resetColors();
 if(!from)return;
 const moves=chess.moves({ square:from, verbose:true });
 moves.forEach(m=>{
  const sq=squares.find(x=>x.userData.square===m.to);
  if(sq)sq.material.color.setHex(0x39dc83);
 });
}

function updateStatus(){
 const status=document.getElementById("status");
 if(chess.isCheckmate()){ status.textContent="🏆 كش مات! "+(chess.turn()==="w"?"الأسود":"الأبيض")+" فاز!"; return true; }
 if(chess.isStalemate()){ status.textContent="🤝 تعادل بسبب الجمود!"; return true; }
 if(chess.isDraw()){ status.textContent="🤝 المباراة انتهت بالتعادل"; return true; }
 if(chess.isCheck()){ status.textContent="⚠️ كش! الملك مهدد"; return false; }
 status.textContent=chess.turn()==="w"?"دورك الآن - الأبيض":"🤖 الكمبيوتر يفكر...";
 return false;
}

function saveMove(){ snapshots.push({ fen: chess.fen(), history: [...chess.history()] }); }

function makeMove(from,to,promotion="q"){
 try{
  const move=chess.move({from,to,promotion});
  if(!move)return false;
  draw(); resetColors(); selected=null;
  document.getElementById("moves").textContent=chess.history().join("  ");
  sound(); return true;
 }catch(e){ return false; }
}

function evaluate(){
 if(chess.isCheckmate()){ return chess.turn()==="w"?-100000:100000; }
 if(chess.isDraw())return 0;
 const values={ p:100,n:320,b:330,r:500,q:900,k:20000 };
 let score=0;
 chess.board().forEach((row,r)=>{
  row.forEach((p,f)=>{
   if(!p)return;
   let value=values[p.type];
   if(p.type==="p"){ value+=(p.color==="b"?r:7-r)*4; }
   const center=7-(Math.abs(3.5-f)+Math.abs(3.5-r));
   value+=center*2;
   score+=p.color==="w"?value:-value;
  });
 });
 return score;
}

function minimax(depth,alpha,beta,maximizing){
 if(depth===0||chess.isGameOver())return evaluate();
 const moves=chess.moves();
 if(maximizing){
  let best=-Infinity;
  for(const m of moves){
   chess.move(m);
   best=Math.max(best, minimax(depth-1,alpha,beta,false));
   chess.undo();
   alpha=Math.max(alpha,best);
   if(beta<=alpha)break;
  }
  return best;
 }else{
  let best=Infinity;
  for(const m of moves){
   chess.move(m);
   best=Math.min(best, minimax(depth-1,alpha,beta,true));
   chess.undo();
   beta=Math.min(beta,best);
   if(beta<=alpha)break;
  }
  return best;
 }
}

function computer(){
 if(chess.isGameOver())return;
 const moves=chess.moves();
 if(!moves.length)return;
 let chosen;
 if(document.getElementById("level").value==="easy"){
  const captures=moves.filter(m=>m.includes("x"));
  const pool=Math.random()<.5&&captures.length?captures:moves;
  chosen=pool[Math.floor(Math.random()*pool.length)];
 }else{
  let best=Infinity;
  for(const m of moves){
   chess.move(m);
   const score=minimax(2,-Infinity,Infinity,true);
   chess.undo();
   if(score<best){ best=score; chosen=m; }
  }
 }
 if(chosen){
  chess.move(chosen); draw();
  document.getElementById("moves").textContent=chess.history().join("  ");
  sound(); updateStatus();
 }
}

function executePlayerMove(from,to,promotion){
 if(!makeMove(from,to,promotion))return;
 document.getElementById("promotion").style.display="none";
 if(updateStatus())return;
 thinking=true;
 setTimeout(()=>{
  if(gameStarted&&!chess.isGameOver()){
   computer(); updateStatus();
  }
  thinking=false;
 },350);
}

function onClick(event){
 if(!gameStarted||thinking||chess.isGameOver()||pendingPromotion)return;
 if(chess.turn()!=="w")return;

 const rect=renderer.domElement.getBoundingClientRect();
 const pointer=new THREE.Vector2(((event.clientX-rect.left)/rect.width)*2-1, -((event.clientY-rect.top)/rect.height)*2+1);
 const ray=new THREE.Raycaster();
 ray.setFromCamera(pointer,camera);

 const pieceHits=ray.intersectObjects(pieces.children,true);
 let clickedSquare=null;

 if(pieceHits.length>0){
  let obj=pieceHits[0].object;
  while(obj&&!obj.userData.square){ obj=obj.parent; }
  if(obj)clickedSquare=obj.userData.square;
 }

 if(!clickedSquare){
  const squareHits=ray.intersectObjects(squares,false);
  if(squareHits.length>0){ clickedSquare=squareHits[0].object.userData.square; }
 }

 if(!clickedSquare)return;

 if(selected){
  const moves=chess.moves({square:selected,verbose:true});
  const move=moves.find(m=>m.to===clickedSquare);
  if(move){
   if(move.promotion){
    pendingPromotion={from:selected,to:clickedSquare};
    document.getElementById("promotion").style.display="block";
    return;
   }
   saveMove(); executePlayerMove(selected,clickedSquare); return;
  }
  const targetPiece=chess.get(clickedSquare);
  if(targetPiece&&targetPiece.color==="w"){ selected=clickedSquare; showMoves(selected); sound(); return; }
  selected=null; resetColors(); return;
 }
 const piece=chess.get(clickedSquare);
 if(piece&&piece.color==="w"){ selected=clickedSquare; showMoves(selected); sound(); }
}

window.startGame=function(){
 sound();
 document.getElementById("menuScreen").style.display="none";
 document.getElementById("gameScreen").style.display="block";
 gameStarted=true;
 if(!initialized){ makeBoard(); initialized=true; }
 window.newGame();
 setTimeout(onResize,100);
};

window.backMenu=function(){
 sound(); gameStarted=false; thinking=false; pendingPromotion=null; selected=null;
 document.getElementById("promotion").style.display="none";
 document.getElementById("gameScreen").style.display="none";
 document.getElementById("menuScreen").style.display="block";
};

window.newGame=function(){
 sound(); chess.reset(); snapshots=[]; selected=null; pendingPromotion=null; thinking=false;
 document.getElementById("promotion").style.display="none";
 document.getElementById("moves").textContent="سجل الحركات سيظهر هنا";
 resetColors(); draw(); updateStatus();
};

window.undoMove=function(){
 if(!gameStarted||thinking||pendingPromotion)return;
 if(snapshots.length===0){notice("لا توجد حركات للتراجع عنها");return;}
 const snap=snapshots.pop();
 try{ chess.load(snap.fen); }catch(e){return;}
 selected=null; pendingPromotion=null;
 document.getElementById("promotion").style.display="none";
 resetColors(); draw();
 document.getElementById("moves").textContent= snap.history.length?snap.history.join("  "):"سجل الحركات سيظهر هنا";
 updateStatus(); sound();
};

window.promote=function(piece){
 if(!pendingPromotion)return;
 sound();
 const {from,to}=pendingPromotion;
 pendingPromotion=null;
 document.getElementById("promotion").style.display="none";
 saveMove(); executePlayerMove(from,to,piece);
};

function onResize(){
 const w=holder.clientWidth; const h=holder.clientHeight;
 if(w===0||h===0){ renderer.setSize(800,500); camera.aspect=800/500; camera.updateProjectionMatrix(); return; }
 camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
}

function animate(){
 requestAnimationFrame(animate);
 const time = Date.now() * 0.002; // وقت للأنيميشن

 // تحريك الوحوش (تطفو وتتنفس)
 animatedPieces.forEach(item => {
  if (item.type === 'q') { // الوزير الناري يطفو عالياً
   item.mesh.position.y = -0.1 + Math.sin(time + item.offset) * 0.3;
   item.mesh.rotation.y += 0.01; // دوران بطيء للنار
  } else if (item.type === 'k') { // الملك يتنفس
   item.mesh.position.y = -0.1 + Math.sin(time + item.offset) * 0.1;
  } else {
   item.mesh.position.y = -0.1 + Math.sin(time + item.offset) * 0.05;
  }
 });

 controls.update();
 renderer.render(scene,camera);
}

renderer.setSize(800,500);
window.addEventListener("resize",onResize);

let downX=0,downY=0;
renderer.domElement.addEventListener("pointerdown",(e)=>{ downX=e.clientX; downY=e.clientY; });
renderer.domElement.addEventListener("pointerup",(e)=>{
 const dx=e.clientX-downX; const dy=e.clientY-downY;
 if(Math.sqrt(dx*dx+dy*dy)<10){ onClick(e); }
});

animate();
</script>
