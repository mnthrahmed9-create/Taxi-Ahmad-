<style>
*{box-sizing:border-box}

body{
 margin:0;
 /* خلفية تحاكي سماء البركان والجحيم في الصورة */
 background: radial-gradient(circle at 50% 20%, #ff7b00 0%, #d93600 15%, #4a0b00 40%, #110200 100%);

/* إضافة جبال في الخلفية لتعزيز العمق */
body::before {

header{

.btn:active{ transform:translateY(4px); box-shadow:inset 0 3px 8px #0009; }

#gameScreen{display:none; position: absolute; inset: 0; z-index: 20; background: transparent;}

#game{

#game canvas{display:block}

.game-panel{

#status{
 color:#ffb38a;

 margin:10px;
 text-shadow: 0 0 10px #ff4500;
}

#moves{
 max-height:65px;
 overflow:auto;
 color:#ddd;
 font-size:12px;
 overflow-wrap:anywhere;
 margin-top:12px;
}

select{
 background:#2a0a00;
 color:white;
 border:1px solid #d4af37;
 border-radius:10px;
 padding:10px;
 font-family:inherit;
 font-weight:bold;
}

#promotion{
 display:none;
 padding:12px;
 background:#2a0a00;
 border-radius:12px;
 margin:10px;
 position: relative; z-index: 10;
}

/* شاشة الانترو */
#splash{
 position:fixed; inset:0; z-index:9999; background:#000;
 display:flex; flex-direction:column; justify-content:center; align-items:center;
 opacity:1; transition:opacity 1s ease;
}
#splash.hide{opacity:0;pointer-events:none;}
#splash .company{
 margin:0; font-size:clamp(48px,15vw,120px); font-weight:900; letter-spacing:16px;
 background:linear-gradient(180deg,#fff8d8 0%,#ffd66b 30%,#8a5c04 50%,#ffd66b 70%,#fff8d8 100%);
 -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
 animation:companyIn 1.4s cubic-bezier(.2,.9,.3,1.1) 0.2s forwards;
}
@keyframes companyIn{ 0% {opacity:0; transform:scale(0.4);} 100%{opacity:1; transform:scale(1);} }
#splash .tagline{ margin-top:22px; color:#e8d4ff; font-size:16px; font-weight:700; letter-spacing:14px; animation:tagIn 1s ease 1.4s forwards; opacity:0;}
@keyframes tagIn{ to{opacity:1;} }
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "chess":"https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm"
 }

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { Chess } from "chess";

const chess = new Chess();
const holder = document.getElementById("game");

let selected = null;
let thinking = false;
let pendingPromotion = null;
let snapshots = [];
let gameStarted = false;
let initialized = false;

const files = "abcdefgh";
const squares = [];

// ==========================================
// إعداد المشهد والمحرك (Three.js)
// ==========================================
const scene = new THREE.Scene();
// جعل الخلفية شفافة لكي تظهر خلفية CSS البركانية
scene.background = null; 

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 8, 10); // زاوية رؤية قريبة من الصورة

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ReinhardToneMapping;
holder.appendChild(renderer.domElement);

// إعدادات ما بعد المعالجة (تأثير التوهج Bloom)
const renderScene = new RenderPass(scene, camera);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
bloomPass.threshold = 0.2;
bloomPass.strength = 1.2;
bloomPass.radius = 0.5;

const composer = new EffectComposer(renderer);
composer.addPass(renderScene);
composer.addPass(bloomPass);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI / 2.1;

// ==========================================
// الإضاءة (إضاءة جحيمية)
// ==========================================
const ambientLight = new THREE.AmbientLight(0x442200, 1.5);
scene.add(ambientLight);

// ضوء برتقالي من الأسفل (يحاكي الحمم)
const lavaLight = new THREE.PointLight(0xff4500, 10, 20);
lavaLight.position.set(0, -2, 0);
scene.add(lavaLight);

// ضوء علوي خافت
const topLight = new THREE.DirectionalLight(0xffaa88, 1.5);
topLight.position.set(5, 10, 5);
topLight.castShadow = true;
scene.add(topLight);

// ==========================================
// بناء بيئة اللوحة الصخرية
// ==========================================
const boardGroup = new THREE.Group();
scene.add(boardGroup);

// 1. الصخرة الأساسية التي تحمل اللوحة
const baseGeo = new THREE.BoxGeometry(9.5, 0.8, 9.5);
const baseMat = new THREE.MeshStandardMaterial({ 
    color: 0x1a1a1a, 
    roughness: 0.9, 
    metalness: 0.2 
});
const base = new THREE.Mesh(baseGeo, baseMat);
base.position.y = -0.45;
base.receiveShadow = true;
boardGroup.add(base);

// 2. حواف متوهجة (تشبه شقوق الحمم)
const borderGeo = new THREE.BoxGeometry(9.8, 0.85, 9.8);
const borderMat = new THREE.MeshStandardMaterial({ 
    color: 0x000000, 
    emissive: 0xff3300, 
    emissiveIntensity: 2 
});
const border = new THREE.Mesh(borderGeo, borderMat);
border.position.y = -0.45;
boardGroup.add(border);

// 3. مربعات اللوحة (حجر داكن وجليد)
function makeBoard() {
    for (let rank = 8; rank >= 1; rank--) {
        for (let f = 0; f < 8; f++) {
            const s = files[f] + rank;
            const x = f - 3.5;
            const z = (8 - rank) - 3.5;

            const isDark = (rank + f) % 2 === 0;
            
            // الحجر الداكن للأسود، والرمادي الفاتح للأبيض
            const mat = new THREE.MeshStandardMaterial({
                color: isDark ? 0x111111 : 0x444444,
                roughness: isDark ? 0.7 : 0.5,
                metalness: 0.3
            });

            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.15, 0.98), mat);
            mesh.position.set(x, -0.05, z);
            mesh.receiveShadow = true;
            mesh.userData.square = s;
            boardGroup.add(mesh);
            squares.push(mesh);
        }
    }
}

// ==========================================
// تصميم الوحوش الصخرية والجليدية
// ==========================================
function monster(type, color) {
    const g = new THREE.Group();
    const isWhite = color === "w";

    // مواد الوحوش (صخر للأسود، جليد للابيض)
    const bodyMat = new THREE.MeshStandardMaterial({
        color: isWhite ? 0x5a8e9e : 0x332222,
        roughness: 0.8,
        flatShading: true, // يعطي مظهر الصخر المنحوت
        metalness: 0.1
    });

    // عيون متوهجة
    const eyeMat = new THREE.MeshBasicMaterial({ 
        color: isWhite ? 0x00ffff : 0xff3300 
    });

    // مادة التاج/القرون
    const crownMat = new THREE.MeshStandardMaterial({ 
        color: 0xd4af37, 
        roughness: 0.3, 
        metalness: 0.8 
    });

    // دالة مساعدة لصنع صخور غير منتظمة
    function addRock(x, y, z, sx, sy, sz, mat) {
        const geo = new THREE.DodecahedronGeometry(1, 0);
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.scale.set(sx, sy, sz);
        m.castShadow = true;
        m.receiveShadow = true;
        g.add(m);
        return m;
    }

    // الجسم الأساسي
    addRock(0, 0.4, 0, 0.35, 0.45, 0.35, bodyMat);
    // الرأس
    addRock(0, 0.9, 0, 0.3, 0.35, 0.3, bodyMat);

    // العيون
    for (const x of [-0.12, 0.12]) {
        const eye = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.04, 0.05), eyeMat);
        eye.position.set(x, 0.95, 0.25);
        g.add(eye);
    }

    // الأكتاف
    addRock(-0.35, 0.5, 0, 0.15, 0.25, 0.2, bodyMat);
    addRock(0.35, 0.5, 0, 0.15, 0.25, 0.2, bodyMat);

    // تفاصيل حسب نوع القطعة
    if (type === "k") { // الملك
        const c1 = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.3, 4), crownMat);
        c1.position.set(0, 1.25, 0); g.add(c1);
        const c2 = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.2, 4), crownMat);
        c2.position.set(-0.15, 1.2, 0); g.add(c2);
        const c3 = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.2, 4), crownMat);
        c3.position.set(0.15, 1.2, 0); g.add(c3);
    } 
    else if (type === "q") { // الملكة
        const crown = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.3, 6), crownMat);
        crown.position.set(0, 1.25, 0); g.add(crown);
    }
    else if (type === "r") { // القلعة
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.3, 6), bodyMat);
        tower.position.set(0, 1.1, 0); g.add(tower);
    }
    else if (type === "b") { // الفيل
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.4, 4), bodyMat);
        spike.position.set(0, 1.2, 0); g.add(spike);
    }
    else if (type === "n") { // الحصان
        const neck = addRock(0, 1.1, 0.1, 0.15, 0.3, 0.2, bodyMat);
        neck.rotation.x = 0.3;
        const horn = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.2, 4), crownMat);
        horn.position.set(0, 1.35, 0.15); g.add(horn);
    }
    else if (type === "p") { // البيدق
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.25, 4), crownMat);
        spike.position.set(0, 1.1, 0); g.add(spike);
    }

    return g;
}

const piecesGroup = new THREE.Group();
scene.add(piecesGroup);

function draw() {
    piecesGroup.clear();
    const state = chess.board();

    for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
            const p = state[r][f];
            if (!p) continue;

            const s = files[f] + (8 - r);
            const x = f - 3.5;
            const z = (8 - r) - 4.5 + 1; // ضبط إحداثيات Z لتطابق اللوحة

            const obj = monster(p.type, p.color);
            obj.position.set(x, 0.05, z);
            obj.userData.square = s;
            obj.userData.color = p.color;

            piecesGroup.add(obj);
        }
    }
    piecesGroup.updateMatrixWorld(true);
}

// ==========================================
// منطق اللعبة (نفس الكود السابق مع تحسينات)
// ==========================================
function resetColors() {
    squares.forEach(s => {
        const rank = Number(s.userData.square[1]);
        const f = files.indexOf(s.userData.square[0]);
        const isDark = (rank + f) % 2 === 0;
        s.material.color.setHex(isDark ? 0x111111 : 0x444444);
        s.material.emissive.setHex(0x000000);
    });
}

function showMoves(from) {
    resetColors();
    if (!from) return;

    const moves = chess.moves({ square: from, verbose: true });
    moves.forEach(m => {
        const sq = squares.find(x => x.userData.square === m.to);
        if (sq) {
            sq.material.emissive.setHex(0x004400); // توهج أخضر للمربعات المتاحة
            sq.material.color.setHex(0x00ff00);
        }
    });
}

function updateStatus() {
    const status = document.getElementById("status");
    if (chess.isCheckmate()) {
        status.textContent = "🏆 كش مات! " + (chess.turn() === "w" ? "وحوش الجحيم" : "وحوش الجليد") + " فازوا!";
        return true;
    }
    if (chess.isDraw() || chess.isStalemate()) {
        status.textContent = "🤝 المباراة انتهت بالتعادل";
        return true;
    }
    if (chess.isCheck()) {
        status.textContent = "⚠️ كش! الملك مهدد";
        return false;
    }
    status.textContent = chess.turn() === "w" ? "دورك الآن - الجيش الأزرق (الجليد)" : "🤖 الكمبيوتر (الجحيم) يفكر...";
    return false;
}

function makeMove(from, to, promotion = "q") {
    try {
        const move = chess.move({ from, to, promotion });
        if (!move) return false;
        draw();
        resetColors();
        selected = null;
        document.getElementById("moves").textContent = chess.history().join("  ");
        return true;
    } catch (e) { return false; }
}

function evaluate() {
    if (chess.isCheckmate()) return chess.turn() === "w" ? -100000 : 100000;
    if (chess.isDraw()) return 0;
    const values = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
    let score = 0;
    chess.board().forEach((row, r) => {
        row.forEach((p, f) => {
            if (!p) return;
            let value = values[p.type] + (p.type === "p" ? (p.color === "b" ? r : 7 - r) * 4 : 0);
            score += p.color === "w" ? value : -value;
        });
    });
    return score;
}

function minimax(depth, alpha, beta, maximizing) {
    if (depth === 0 || chess.isGameOver()) return evaluate();
    const moves = chess.moves();
    if (maximizing) {
        let best = -Infinity;
        for (const m of moves) {
            chess.move(m);
            best = Math.max(best, minimax(depth - 1, alpha, beta, false));
            chess.undo();
            alpha = Math.max(alpha, best);
            if (beta <= alpha) break;
        }
        return best;
    } else {
        let best = Infinity;
        for (const m of moves) {
            chess.move(m);
            best = Math.min(best, minimax(depth - 1, alpha, beta, true));
            chess.undo();
            beta = Math.min(beta, best);
            if (beta <= alpha) break;
        }
        return best;
    }
}

function computer() {
    if (chess.isGameOver()) return;
    const moves = chess.moves();
    if (!moves.length) return;
    let chosen;
    if (document.getElementById("level").value === "easy") {
        const captures = moves.filter(m => m.includes("x"));
        const pool = Math.random() < 0.5 && captures.length ? captures : moves;
        chosen = pool[Math.floor(Math.random() * pool.length)];
    } else {
        let best = Infinity;
        for (const m of moves) {
            chess.move(m);
            const score = minimax(2, -Infinity, Infinity, true);
            chess.undo();
            if (score < best) { best = score; chosen = m; }
        }
    }
    if (chosen) {
        chess.move(chosen);
        draw();
        document.getElementById("moves").textContent = chess.history().join("  ");
        updateStatus();
    }
}

function executePlayerMove(from, to, promotion) {
    if (!makeMove(from, to, promotion)) return;
    document.getElementById("promotion").style.display = "none";
    if (updateStatus()) return;
    thinking = true;
    setTimeout(() => {
        if (gameStarted && !chess.isGameOver()) {
            computer();
            updateStatus();
        }
        thinking = false;
    }, 350);
}

// ==========================================
// التحكم بالنقر
// ==========================================
function onClick(event) {
    if (!gameStarted || thinking || chess.isGameOver() || pendingPromotion) return;
    if (chess.turn() !== "w") return;

    const rect = renderer.domElement.getBoundingClientRect();
    const pointer = new THREE.Vector2(
        ((event.clientX - rect.left) / rect.width) * 2 - 1,
        -((event.clientY - rect.top) / rect.height) * 2 + 1
    );

    const ray = new THREE.Raycaster();
    ray.setFromCamera(pointer, camera);

    const pieceHits = ray.intersectObjects(piecesGroup.children, true);
    let clickedSquare = null;

    if (pieceHits.length > 0) {
        let obj = pieceHits[0].object;
        while (obj && !obj.userData.square) obj = obj.parent;
        if (obj) clickedSquare = obj.userData.square;
    }

    if (!clickedSquare) {
        const squareHits = ray.intersectObjects(squares, false);
        if (squareHits.length > 0) clickedSquare = squareHits[0].object.userData.square;
    }

    if (!clickedSquare) return;

    if (selected) {
        const moves = chess.moves({ square: selected, verbose: true });
        const move = moves.find(m => m.to === clickedSquare);
        if (move) {
            if (move.promotion) {
                pendingPromotion = { from: selected, to: clickedSquare };
                document.getElementById("promotion").style.display = "block";
                return;
            }
            saveMove();
            executePlayerMove(selected, clickedSquare);
            return;
        }
        const targetPiece = chess.get(clickedSquare);
        if (targetPiece && targetPiece.color === "w") {
            selected = clickedSquare;
            showMoves(selected);
            return;
        }
        selected = null;
        resetColors();
        return;
    }

    const piece = chess.get(clickedSquare);
    if (piece && piece.color === "w") {
        selected = clickedSquare;
        showMoves(selected);
    }
}

// ==========================================
// دوال التحكم العامة
// ==========================================
window.startGame = function() {
    document.getElementById("menuScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
    gameStarted = true;
    if (!initialized) {
        makeBoard();
        initialized = true;
    }
    window.newGame();
    setTimeout(onResize, 100);
};

window.backMenu = function() {
    gameStarted = false;
    thinking = false;
    pendingPromotion = null;
    selected = null;
    document.getElementById("promotion").style.display = "none";
    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("menuScreen").style.display = "block";
};

window.newGame = function() {
    chess.reset();
    snapshots = [];
    selected = null;
    pendingPromotion = null;
    thinking = false;
    document.getElementById("promotion").style.display = "none";
    document.getElementById("moves").textContent = "سجل الحركات سيظهر هنا";
    resetColors();
    draw();
    updateStatus();
};

function saveMove() { snapshots.push({ fen: chess.fen(), history: [...chess.history()] }); }

window.undoMove = function() {
    if (!gameStarted || thinking || pendingPromotion) return;
    if (snapshots.length === 0) return;
    const snap = snapshots.pop();
    chess.load(snap.fen);
    selected = null;
    pendingPromotion = null;
    document.getElementById("promotion").style.display = "none";
    resetColors();
    draw();
    document.getElementById("moves").textContent = snap.history.length ? snap.history.join("  ") : "سجل الحركات سيظهر هنا";
    updateStatus();
};

window.promote = function(piece) {
    if (!pendingPromotion) return;
    const { from, to } = pendingPromotion;
    pendingPromotion = null;
    document.getElementById("promotion").style.display = "none";
    saveMove();
    executePlayerMove(from, to, piece);
};

function onResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
}

// ==========================================
// حلقة العرض (Animation Loop)
// ==========================================
let time = 0;
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    
    // تأثير نبض ضوء الحمم
    time += 0.05;
    lavaLight.intensity = 8 + Math.sin(time) * 3;

    // تدوير بطيء جداً للوحة لإعطاء شعور بالحياة
    // boardGroup.rotation.y = Math.sin(time * 0.1) * 0.05;

    composer.render(); // استخدام composer بدلاً من renderer لتفعيل التوهج
}

// التهيئة النهائية
window.addEventListener("resize", onResize);
onResize();

let downX = 0, downY = 0;
renderer.domElement.addEventListener("pointerdown", (e) => {
    downX = e.clientX; downY = e.clientY;
});
renderer.domElement.addEventListener("pointerup", (e) => {
    const dx = e.clientX - downX;
    const dy = e.clientY - downY;
    if (Math.sqrt(dx * dx + dy * dy) < 10) onClick(e);
});

animate();
</script>
