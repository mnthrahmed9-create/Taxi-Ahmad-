<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🐉 Monster Chess 4D - الأسطوري</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
 margin:0;
 background:radial-gradient(circle at top,#0a122e,#03050d 65%,#000000);
 color:white;
 font-family:Cairo,Arial,sans-serif;
 text-align:center;
 min-height:100vh;
 overflow-x:hidden;
 user-select:none;
}

header{
 padding:20px 10px 12px;
 background:linear-gradient(135deg,#040e24,#000000);
 border-bottom:2px solid #0088ff;
 box-shadow:0 5px 25px #0088ff33;
}

h1{
 margin:0;
 font-size:clamp(23px,6vw,38px);
 color:#00d4ff;
 text-shadow:0 0 15px #00d4ff,0 0 30px #00d4ff88;
 letter-spacing:1px;
}

.subtitle{
 color:#a0c4ff;
 font-size:13px;
 letter-spacing:3px;
}

.section{
 width:min(95%,850px);
 margin:22px auto;
 padding:20px 14px;
 border:1px solid #0088ff44;
 border-radius:22px;
 background:linear-gradient(145deg,#ffffff08,#ffffff02);
 box-shadow:0 10px 35px #0007,inset 0 0 20px #0088ff11;
}

.section-title{
 color:#ffd700;
 font-size:18px;
 font-weight:900;
 margin:10px 0 18px;
 text-shadow:0 0 10px #ffd70088;
}

.buttons{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:12px;
}

.btn{
 position:relative;
 overflow:hidden;
 cursor:pointer;
 border:2px solid #00d4ff;
 border-radius:13px;
 min-width:135px;
 padding:13px 18px;
 color:white;
 font-family:inherit;
 font-weight:900;
 font-size:15px;
 text-shadow:0 2px 4px #0009;
 box-shadow:inset 0 3px 5px #ffffff33, inset 0 -5px 8px #0007, 0 6px 12px #0008;
 transition:.15s;
 background:linear-gradient(#0a1a3a,#020710);
}

.btn:before{
 content:"";
 position:absolute;
 top:0;
 left:10%;
 width:80%;
 height:45%;
 background:linear-gradient(#ffffff33,transparent);
 border-radius:0 0 50% 50%;
 pointer-events:none;
}

.btn:active{
 transform:translateY(4px);
 box-shadow:inset 0 3px 8px #0009;
}

.btn:disabled{
 opacity:.4;
 cursor:not-allowed;
 transform:none;
}

.gold{background:linear-gradient(#ffd700,#b8860b,#4a3000);color:#000;border-color:#ffd700; text-shadow:none;}
.green{background:linear-gradient(#00ff88,#006633);border-color:#00ff88}
.purple{background:linear-gradient(#a855f7,#4c1d95);border-color:#a855f7}
.blue{background:linear-gradient(#00d4ff,#0055aa);border-color:#00d4ff}
.red{background:linear-gradient(#ff4444,#990000);border-color:#ff4444}

.large{
 width:min(90%,340px);
 padding:18px;
 font-size:22px;
 border-radius:35px;
}

.small{min-width:100px;font-size:13px;padding:10px}

#gameScreen{display:none}

#game{
 width:100%;
 height:60vh;
 min-height:400px;
 max-height:700px;
 touch-action:none;
 overflow:hidden;
 border-radius:15px;
 position:relative;
 box-shadow: inset 0 0 50px #000;
}

#game canvas{display:block}

.game-panel{
 width:min(96%,800px);
 margin:15px auto;
 padding:13px;
 background:#050a18;
 border:1px solid #0088ff44;
 border-radius:18px;
 box-shadow: 0 0 20px #0088ff11;
}

#status{
 color:#00d4ff;
 font-weight:900;
 font-size:16px;
 margin:10px;
 min-height:22px;
 text-shadow:0 0 8px #00d4ff88;
}

#status.check{color:#ff4444;text-shadow:0 0 10px #ff0000;animation:pulseWarn .6s infinite alternate}
@keyframes pulseWarn{to{text-shadow:0 0 20px #ff0000;transform:scale(1.03)}}

#moves{
 max-height:80px;
 overflow:auto;
 color:#c0d4ff;
 font-size:12px;
 overflow-wrap:anywhere;
 margin-top:10px;
 padding:8px;
 background:#02040a;
 border-radius:8px;
 text-align:right;
 line-height:1.6;
}

select{
 background:#0a122e;
 color:#00d4ff;
 border:1px solid #00d4ff;
 border-radius:10px;
 padding:10px;
 font-family:inherit;
 font-weight:bold;
 cursor:pointer;
}

#promotion{
 display:none;
 padding:12px;
 background:#0a122e;
 border-radius:12px;
 margin:10px;
 border:2px solid #00d4ff;
 animation:pulsePromo .5s ease;
 box-shadow: 0 0 20px #00d4ff44;
}

@keyframes pulsePromo{
 from{transform:scale(0.8);opacity:0}
 to{transform:scale(1);opacity:1}
}

#settings,#winModal{
 display:none;
 position:fixed;
 inset:0;
 z-index:10;
 background:#000c;
 justify-content:center;
 align-items:center;
 padding:15px;
 backdrop-filter:blur(4px);
}

.modal{
 width:min(95%,420px);
 background:linear-gradient(145deg,#0a1a3a,#02040a);
 border:2px solid #00d4ff;
 border-radius:20px;
 padding:22px;
 box-shadow:0 0 35px #00d4ff44;
 animation:modalIn .3s ease;
}

@keyframes modalIn{
 from{transform:scale(0.85);opacity:0}
 to{transform:scale(1);opacity:1}
}

.setting-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px 0;
 border-bottom:1px solid #ffffff11;
}

input[type=checkbox]{width:22px;height:22px;accent-color:#00d4ff;cursor:pointer}

#notice{
 color:#00d4ff;
 min-height:25px;
 font-size:13px;
 margin:8px;
}

/* شريط المعلومات العلوي */
.top-bar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:10px 15px;
 background:linear-gradient(90deg,#02050d,#0a122e,#02050d);
 border-radius:12px;
 margin-bottom:10px;
 font-size:14px;
 font-weight:700;
 border: 1px solid #00d4ff22;
}

.player-info{
 display:flex;
 align-items:center;
 gap:8px;
 padding:6px 12px;
 border-radius:8px;
 transition:.3s;
}

.player-info.active{
 background:#00d4ff22;
 box-shadow:0 0 15px #00d4ff33;
}

.player-icon{font-size:22px}
.player-name{color:#00d4ff}

.timer{
 font-family:'Courier New',monospace;
 font-size:18px;
 font-weight:900;
 color:#fff;
 min-width:60px;
 text-align:center;
 padding:4px 8px;
 background:#000;
 border-radius:6px;
 border: 1px solid #00d4ff33;
}

/* شارة الدور */
.turn-badge{
 position:absolute;
 top:10px;
 left:10px;
 background:#00d4ffcc;
 color:#000;
 font-weight:900;
 padding:6px 14px;
 border-radius:20px;
 font-size:12px;
 box-shadow:0 0 20px #00d4ff66;
 pointer-events:none;
 z-index:5;
 animation:pulseBadge 1.5s ease infinite;
}
@keyframes pulseBadge{
 0%,100%{transform:scale(1)}
 50%{transform:scale(1.05)}
}

/* شاشة الفوز */
#winModal .modal{
 background:linear-gradient(145deg,#0a1a3a,#000);
 text-align:center;
 border-color: #ffd700;
 box-shadow: 0 0 40px #ffd70044;
}

#winModal h2{
 font-size:32px;
 margin:10px 0;
 color:#ffd700;
 text-shadow:0 0 20px #ffd700;
 animation:pulseWarn 1s infinite alternate;
}
</style>
</head>
<body>

<header>
<h1>🐉 MONSTER CHESS 4D</h1>
<div class="subtitle">مملكة الوحوش الأسطورية ⚔️</div>
</header>

<!-- القائمة الرئيسية -->
<div id="menuScreen">
<div class="section">
<div class="section-title">👑 أهلاً بك في مملكة الوحوش</div>
<div style="font-size:65px;margin:10px;animation:pulseWarn 2s infinite">🐉 ⚔️ 👹</div>
<p style="color:#a0c4ff;font-size:13px">استعد للمعركة... اختر جيشك وابدأ المواجهة!</p>
<button class="btn gold large" onclick="startGame()">⚔️ ابدأ المواجهة</button>
</div>

<div class="section">
<div class="section-title">🎮 أوضاع اللعب</div>
<div class="buttons">
<button class="btn blue" onclick="startGame()">🤖 ضد الكمبيوتر</button>
<button class="btn purple" onclick="comingSoon('اللعب أونلاين')">🌐 اللعب أونلاين</button>
</div>
</div>
</div>

<!-- شاشة اللعب -->
<div id="gameScreen">
<div class="game-panel">
<div class="top-bar">
 <div class="player-info" id="blackInfo">
  <span class="player-icon">👹</span>
  <span class="player-name">الأسود</span>
  <span class="timer" id="blackTimer">10:00</span>
 </div>
 <div style="color:#00d4ff;font-size:12px">VS</div>
 <div class="player-info active" id="whiteInfo">
  <span class="timer" id="whiteTimer">10:00</span>
  <span class="player-name">الأبيض</span>
  <span class="player-icon">🐲</span>
 </div>
</div>

<div class="buttons">
<select id="level">
<option value="easy">🟢 سهل</option>
<option value="medium">🟡 متوسط</option>
<option value="hard">🔴 صعب</option>
<option value="legendary">💀 أسطوري</option>
</select>
<button class="btn blue small" onclick="newGame()">🔄 لعبة جديدة</button>
<button class="btn blue small" id="undoBtn" onclick="undoMove()">↩️ تراجع</button>
<button class="btn blue small" onclick="showHint()">💡 تلميح</button>
<button class="btn red small" onclick="backMenu()">🏠 الرئيسية</button>
</div>
</div>

<div id="game">
 <div class="turn-badge" id="turnBadge">🐲 دورك</div>
</div>

<div class="game-panel">
<div id="status">دورك الآن - الأبيض</div>
<div id="promotion">
<strong>👑 اختر ترقية البيدق</strong>
<div class="buttons" style="margin-top:10px">
<button class="btn gold small" onclick="promote('q')">ملكة 👑</button>
<button class="btn gold small" onclick="promote('r')">قلعة 🏰</button>
<button class="btn gold small" onclick="promote('b')">فيل 🔮</button>
<button class="btn gold small" onclick="promote('n')">حصان 🐴</button>
</div>
</div>
<div id="moves">سجل الحركات سيظهر هنا</div>
</div>
</div>

<!-- شاشة الفوز -->
<div id="winModal">
<div class="modal">
<div class="confetti" id="winEmoji">🏆</div>
<h2 id="winTitle">فوز!</h2>
<p id="winMsg" style="color:#a0c4ff;font-size:15px;margin:15px 0">أحسنت!</p>
<div class="buttons">
<button class="btn gold" onclick="closeWinModal(true)">🎮 العب مجدداً</button>
<button class="btn red" onclick="closeWinModal(false)">🏠 القائمة</button>
</div>
</div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "chess":"https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm"
 }
}
</script>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {Chess} from "chess";
// استيراد تأثيرات ما بعد المعالجة (Post-Processing) لتعطي شكل 4D
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

// ==================================================
//  1) الحالة العامة
// ==================================================
const chess = new Chess();
const holder = document.getElementById("game");
const files = "abcdefgh";

let selected = null;
let thinking = false;
let pendingPromotion = null;
let snapshots = [];
let gameStarted = false;
let initialized = false;
let lastMove = null;
let gameOver = false;

let whiteTime = 600, blackTime = 600;
let timerInterval = null;
let turnStartTime = 0;

// ==================================================
//  2) إعداد Three.js (البيئة 4D)
// ==================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040a); // خلفية سوداء مائلة للزرقة
scene.fog = new THREE.FogExp2(0x02040a, 0.03);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(8, 10, 12);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
holder.appendChild(renderer.domElement);

// إعداد الـ Composer للتوهج
const renderScene = new RenderPass(scene, camera);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
bloomPass.threshold = 0.2;
bloomPass.strength = 1.2; // قوة التوهج
bloomPass.radius = 0.5;

const composer = new EffectComposer(renderer);
composer.addPass(renderScene);
composer.addPass(bloomPass);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.minDistance = 8;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI / 2.1;

// الإضاءة الديناميكية
const hemi = new THREE.HemisphereLight(0x0088ff, 0x000000, 1.5);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(5, 15, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 30;
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -10;
scene.add(sun);

const ambient = new THREE.AmbientLight(0x112244, 1.5);
scene.add(ambient);

// إضاءة ملونة متحركة (تعطي طابع الطاقة)
const energyLight1 = new THREE.PointLight(0x00d4ff, 3, 20);
energyLight1.position.set(0, 4, 0);
scene.add(energyLight1);

const energyLight2 = new THREE.PointLight(0xffd700, 2, 20);
energyLight2.position.set(0, 3, 0);
scene.add(energyLight2);

// الأرضية
const floor = new THREE.Mesh(
 new THREE.PlaneGeometry(200, 200),
 new THREE.MeshStandardMaterial({ color:0x010205, roughness:0.2, metalness:0.8 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.8;
floor.receiveShadow = true;
scene.add(floor);

// قاعدة الرقعة العظمى (مستوحاة من الصورة)
const base = new THREE.Mesh(
 new THREE.BoxGeometry(9.5, 0.8, 9.5),
 new THREE.MeshPhysicalMaterial({ color:0x050a14, metalness:0.9, roughness:0.1, clearcoat:1 })
);
base.position.y = -0.45;
base.receiveShadow = true;
base.castShadow = true;
scene.add(base);

// حواف مذهبة متوهجة
const edgeMat = new THREE.MeshStandardMaterial({ color:0xffd700, metalness:1, roughness:0.2, emissive:0xaa7700, emissiveIntensity:1.5 });
for(let i=0;i<4;i++){
 const edge = new THREE.Mesh(new THREE.BoxGeometry(9.5, 0.1, 0.2), edgeMat);
 edge.position.y = -0.02;
 if(i===0) edge.position.z = -4.75;
 if(i===1) edge.position.z = 4.75;
 if(i===2){ edge.rotation.y = Math.PI/2; edge.position.x = -4.75; }
 if(i===3){ edge.rotation.y = Math.PI/2; edge.position.x = 4.75; }
 scene.add(edge);
}

const board = new THREE.Group();
scene.add(board);
const pieces = new THREE.Group();
scene.add(pieces);

const squares = [];

// ==================================================
//  3) إنشاء رقعة الشطرنج (رخام ونيون)
// ==================================================
function position(square){
 return {
  x: files.indexOf(square[0]) - 3.5,
  z: Number(square[1]) - 4.5
 };
}

function makeBoard(){
 for(let rank=8; rank>=1; rank--){
  for(let f=0; f<8; f++){
   const s = files[f] + rank;
   const p = position(s);
   const isDark = (rank + f) % 2 === 0;

   // خامات رخامية عاكسة
   const mat = new THREE.MeshPhysicalMaterial({
    color: isDark ? 0x050a14 : 0x0a1a3a, // أسود مزرق وأزرق داكن
    roughness: 0.1, // لامع جداً
    metalness: 0.5,
    clearcoat: 1,
    clearcoatRoughness: 0.1,
    emissive: isDark ? 0x000000 : 0x001133,
    emissiveIntensity: 0.5
   });

   const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(0.98, 0.15, 0.98),
    mat
   );
   mesh.position.set(p.x, -0.035, p.z);
   mesh.receiveShadow = true;
   mesh.userData.square = s;
   mesh.userData.originalColor = isDark ? 0x050a14 : 0x0a1a3a;

   board.add(mesh);
   squares.push(mesh);

   // إضافة خطوط نيون بين المربعات
   if(f < 7) {
       const line = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.16, 0.98), new THREE.MeshBasicMaterial({color: 0x00d4ff}));
       line.position.set(p.x + 0.5, -0.035, p.z);
       board.add(line);
   }
   if(rank > 1) {
       const line = new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.16, 0.02), new THREE.MeshBasicMaterial({color: 0x00d4ff}));
       line.position.set(p.x, -0.035, p.z - 0.5);
       board.add(line);
   }
  }
 }
}

// ==================================================
//  4) تصميم القطع (ذهبية وأوبسيديان)
// ==================================================
function monster(type, color){
 const g = new THREE.Group();

 // الأبيض: ذهبي متوهج | الأسود: أزرق داكن/أوبسيديان متوهج
 const isWhite = color === "w";
 
 const mainMat = new THREE.MeshPhysicalMaterial({
  color: isWhite ? 0xffd700 : 0x020b1c,
  metalness: 1.0,
  roughness: 0.15,
  clearcoat: 1,
  emissive: isWhite ? 0x553300 : 0x0022ff,
  emissiveIntensity: isWhite ? 0.5 : 1.0
 });

 const accentMat = new THREE.MeshStandardMaterial({
  color: isWhite ? 0xffffff : 0x00d4ff,
  metalness: 0.8,
  roughness: 0.2,
  emissive: isWhite ? 0xffffff : 0x00d4ff,
  emissiveIntensity: 2.0 // توهج قوي
 });

 function sphere(x,y,z,sx,sy,sz,mat){
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), mat);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  m.castShadow = true;
  g.add(m);
  return m;
 }

 function cone(x,y,z,size,mat,rotX=0,rotZ=0){
  const m = new THREE.Mesh(new THREE.ConeGeometry(size, 0.5, 16), mat);
  m.position.set(x, y, z);
  m.rotation.x = rotX;
  m.rotation.z = rotZ;
  m.castShadow = true;
  g.add(m);
  return m;
 }

 function cylinder(x,y,z,rt,rb,h,mat){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 16), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  g.add(m);
  return m;
 }

 // الهيكل الأساسي
 sphere(0, 0.45, 0, 0.35, 0.5, 0.35, mainMat);
 sphere(0, 0.95, 0, 0.35, 0.4, 0.35, mainMat);

 // عيون متوهجة
 for(const x of [-0.15, 0.15]){
  sphere(x, 1.05, 0.3, 0.08, 0.08, 0.05, accentMat);
 }

 // تفاصيل القطع
 if(type === "k"){
  cylinder(0, 1.35, 0, 0.3, 0.35, 0.2, mainMat);
  cone(0, 1.6, 0, 0.15, accentMat);
  sphere(0, 1.75, 0, 0.1, 0.1, 0.1, accentMat);
 }

 if(type === "q"){
  cylinder(0, 1.35, 0, 0.32, 0.35, 0.15, mainMat);
  for(let i=0; i<6; i++){
   const ang = (i/6)*Math.PI*2;
   sphere(Math.cos(ang)*0.25, 1.5, Math.sin(ang)*0.25, 0.06, 0.06, 0.06, accentMat);
  }
  sphere(0, 1.6, 0, 0.12, 0.12, 0.12, accentMat);
 }

 if(type === "r"){
  cylinder(0, 1.3, 0, 0.3, 0.35, 0.3, mainMat);
  for(let i=0; i<4; i++){
   const ang = (i/4)*Math.PI*2 + Math.PI/4;
   const m = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.2, 0.12), accentMat);
   m.position.set(Math.cos(ang)*0.28, 1.55, Math.sin(ang)*0.28);
   m.castShadow = true;
   g.add(m);
  }
 }

 if(type === "b"){
  cylinder(0, 1.3, 0, 0.25, 0.35, 0.2, mainMat);
  cone(0, 1.65, 0, 0.2, accentMat);
  sphere(0, 1.9, 0, 0.08, 0.08, 0.08, accentMat);
 }

 if(type === "n"){
  sphere(0, 1.05, 0.35, 0.2, 0.25, 0.35, mainMat);
  sphere(0, 1.3, 0.5, 0.15, 0.2, 0.2, mainMat);
  cone(-0.1, 1.5, 0.4, 0.08, accentMat);
  cone(0.1, 1.5, 0.4, 0.08, accentMat);
 }

 if(type === "p"){
  sphere(0, 1.3, 0, 0.18, 0.2, 0.18, mainMat);
  sphere(0, 1.5, 0, 0.12, 0.12, 0.12, accentMat);
 }

 // قاعدة القطعة
 cylinder(0, 0.1, 0, 0.3, 0.35, 0.2, mainMat);

 return g;
}

// ==================================================
//  5) نظام الرسوم المتحركة والحركات
// ==================================================
const tweens = [];
function addTween(obj, targetPos, duration=0.28, onComplete){
 const start = { x: obj.position.x, y: obj.position.y, z: obj.position.z, sx: obj.scale.x, sy: obj.scale.y, sz: obj.scale.z };
 const end = {
  x: targetPos.x !== undefined ? targetPos.x : start.x,
  y: targetPos.y !== undefined ? targetPos.y : start.y,
  z: targetPos.z !== undefined ? targetPos.z : start.z,
  sx: targetPos.sx !== undefined ? targetPos.sx : start.sx,
  sy: targetPos.sy !== undefined ? targetPos.sy : start.sy,
  sz: targetPos.sz !== undefined ? targetPos.sz : start.sz
 };
 tweens.push({ obj, start, end, duration, elapsed: 0, onComplete });
}

function updateTweens(dt){
 for(let i = tweens.length - 1; i >= 0; i--){
  const t = tweens[i];
  t.elapsed += dt;
  let k = Math.min(t.elapsed / t.duration, 1);
  const e = 1 - Math.pow(1 - k, 3);

  t.obj.position.x = t.start.x + (t.end.x - t.start.x) * e;
  t.obj.position.y = t.start.y + (t.end.y - t.start.y) * e;
  t.obj.position.z = t.start.z + (t.end.z - t.start.z) * e;
  t.obj.scale.x = t.start.sx + (t.end.sx - t.start.sx) * e;
  t.obj.scale.y = t.start.sy + (t.end.sy - t.start.sy) * e;
  t.obj.scale.z = t.start.sz + (t.end.sz - t.start.sz) * e;

  if(k >= 1){
   if(t.onComplete) t.onComplete();
   tweens.splice(i, 1);
  }
 }
}

let pieceMap = {};
function draw(){
 pieces.children.forEach(c => {
  c.traverse(o => { if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
 });
 pieces.clear();
 pieceMap = {};

 const state = chess.board();
 for(let r=0; r<8; r++){
  for(let f=0; f<8; f++){
   const p = state[r][f];
   if(!p) continue;

   const s = files[f] + (8-r);
   const pos = position(s);
   const obj = monster(p.type, p.color);

   obj.position.set(pos.x, 0.05, pos.z);
   obj.userData.square = s;
   obj.userData.color = p.color;
   obj.userData.type = p.type;

   pieces.add(obj);
   pieceMap[s] = obj;
  }
 }
}

function resetColors(){
 squares.forEach(s => {
  s.material.color.setHex(s.userData.originalColor);
  s.material.emissive.setHex(s.userData.originalColor === 0x050a14 ? 0x000000 : 0x001133);
  s.material.emissiveIntensity = 0.5;
 });
}

function highlightLastMove(){
 if(!lastMove) return;
 for(const sq of [lastMove.from, lastMove.to]){
  const s = squares.find(x => x.userData.square === sq);
  if(s){
   s.material.emissive.setHex(0x00d4ff);
   s.material.emissiveIntensity = 1.5;
  }
 }
}

function highlightCheck(){
 if(!chess.isCheck()) return;
 const turn = chess.turn();
 const board = chess.board();
 for(let r=0; r<8; r++){
  for(let f=0; f<8; f++){
   const p = board[r][f];
   if(p && p.type === "k" && p.color === turn){
    const sq = files[f] + (8-r);
    const s = squares.find(x => x.userData.square === sq);
    if(s){
     s.material.emissive.setHex(0xff0000);
     s.material.emissiveIntensity = 2.0;
    }
   }
  }
 }
}

function showMoves(from){
 resetColors();
 highlightLastMove();
 highlightCheck();
 if(!from) return;

 const moves = chess.moves({ square: from, verbose: true });
 moves.forEach(m => {
  const sq = squares.find(x => x.userData.square === m.to);
  if(sq){
   sq.material.emissive.setHex(m.captured ? 0xff0000 : 0x00ff88);
   sq.material.emissiveIntensity = 1.5;
  }
 });
}

// ==================================================
//  6) المنطق الأساسي للعبة
// ==================================================
function updateStatus(){
 const statusEl = document.getElementById("status");
 const badge = document.getElementById("turnBadge");
 statusEl.classList.remove("check");

 if(chess.isCheckmate()){
  statusEl.textContent = "🏆 كش مات!";
  showWinModal(chess.turn() === "w" ? "الأسود" : "الأبيض");
  return true;
 }
 if(chess.isDraw() || chess.isStalemate()){
  statusEl.textContent = "🤝 تعادل!";
  showWinModal("draw");
  return true;
 }
 if(chess.isCheck()){
  statusEl.textContent = "⚠️ كش! الملك مهدد";
  statusEl.classList.add("check");
 }

 if(chess.turn() === "w"){
  if(!chess.isCheck()) statusEl.textContent = "دورك الآن - الأبيض 🐲";
  badge.textContent = "🐲 دورك";
  badge.style.background = "#ffd700";
  document.getElementById("whiteInfo").classList.add("active");
  document.getElementById("blackInfo").classList.remove("active");
 } else {
  if(!chess.isCheck()) statusEl.textContent = "🤖 الكمبيوتر يفكر...";
  badge.textContent = "👹 الكمبيوتر";
  badge.style.background = "#00d4ff";
  document.getElementById("blackInfo").classList.add("active");
  document.getElementById("whiteInfo").classList.remove("active");
 }
 return false;
}

function makeMove(from, to, promotion="q"){
 try{
  const move = chess.move({ from, to, promotion });
  if(!move) return false;
  
  lastMove = { from, to };
  draw();
  
  const newPiece = pieceMap[to];
  if(newPiece){
   newPiece.scale.set(0.1, 0.1, 0.1);
   addTween(newPiece, { sx:1, sy:1, sz:1 }, 0.4);
  }

  resetColors();
  highlightLastMove();
  updateStatus();
  return true;
 }catch(e){ return false; }
}

// الذكاء الاصطناعي (مبسط للسرعة)
function computer(){
 if(chess.isGameOver() || gameOver) return;
 const moves = chess.moves();
 if(!moves.length) return;

 const level = document.getElementById("level").value;
 let chosen = moves[Math.floor(Math.random() * moves.length)];

 if(level !== "easy"){
  // خوارزمية بسيطة لاختيار أفضل حركة (تأكل القطع)
  let bestMove = moves[0];
  let maxScore = -Infinity;
  for(const m of moves){
   chess.move(m);
   let score = 0;
   if(chess.isCheckmate()) score = 10000;
   else if(chess.isCheck()) score = 50;
   const board = chess.board();
   // تقييم سريع
   for(let r=0;r<8;r++) for(let f=0;f<8;f++){
       const p = board[r][f];
       if(p){
           const val = {p:10,n:30,b:30,r:50,q:90,k:900}[p.type];
           score += (p.color === 'b' ? val : -val);
       }
   }
   chess.undo();
   if(score > maxScore){ maxScore = score; bestMove = m; }
  }
  chosen = bestMove;
 }

 if(chosen){
  const from = chosen.slice(0, 2);
  const to = chosen.slice(2, 4);
  makeMove(from, to);
 }
}

function executePlayerMove(from, to, promotion){
 if(makeMove(from, to, promotion)){
  document.getElementById("promotion").style.display = "none";
  if(chess.isGameOver() || gameOver) return;
  thinking = true;
  document.getElementById("status").textContent = "🤖 الكمبيوتر يفكر...";
  setTimeout(() => {
   computer();
   thinking = false;
  }, 500);
 }
}

// ==================================================
//  7) التفاعل (النقر)
// ==================================================
function onClick(event){
 if(!gameStarted || thinking || chess.isGameOver() || gameOver || pendingPromotion) return;
 if(chess.turn() !== "w") return;

 const rect = renderer.domElement.getBoundingClientRect();
 const pointer = new THREE.Vector2(
  ((event.clientX - rect.left) / rect.width) * 2 - 1,
  -((event.clientY - rect.top) / rect.height) * 2 + 1
 );

 const ray = new THREE.Raycaster();
 ray.setFromCamera(pointer, camera);

 const pieceHits = ray.intersectObjects(pieces.children, true);
 let clickedSquare = null;

 if(pieceHits.length > 0){
  let obj = pieceHits[0].object;
  while(obj && !obj.userData.square) obj = obj.parent;
  if(obj) clickedSquare = obj.userData.square;
 }

 if(!clickedSquare){
  const squareHits = ray.intersectObjects(squares, false);
  if(squareHits.length > 0) clickedSquare = squareHits[0].object.userData.square;
 }

 if(!clickedSquare) return;

 if(selected){
  const moves = chess.moves({ square: selected, verbose: true });
  const move = moves.find(m => m.to === clickedSquare);

  if(move){
   if(move.promotion){
    pendingPromotion = { from: selected, to: clickedSquare };
    document.getElementById("promotion").style.display = "block";
    return;
   }
   executePlayerMove(selected, clickedSquare);
   return;
  }
 }

 const piece = chess.get(clickedSquare);
 if(piece && piece.color === "w"){
  selected = clickedSquare;
  showMoves(selected);
 }
}

// ==================================================
//  8) التهيئة وحلقة العرض
// ==================================================
window.startGame = function(){
 document.getElementById("menuScreen").style.display = "none";
 document.getElementById("gameScreen").style.display = "block";
 gameStarted = true;
 if(!initialized){ makeBoard(); initialized = true; }
 window.newGame();
 onResize();
};

window.backMenu = function(){
 gameStarted = false;
 document.getElementById("gameScreen").style.display = "none";
 document.getElementById("menuScreen").style.display = "block";
};

window.newGame = function(){
 chess.reset();
 selected = null;
 pendingPromotion = null;
 thinking = false;
 gameOver = false;
 lastMove = null;
 resetColors();
 draw();
 updateStatus();
 document.getElementById("winModal").style.display = "none";
};

window.promote = function(piece){
 if(!pendingPromotion) return;
 executePlayerMove(pendingPromotion.from, pendingPromotion.to, piece);
};

window.showHint = function(){
 if(!gameStarted || thinking || chess.turn() !== "w" || gameOver) return;
 const moves = chess.moves();
 if(!moves.length) return;
 const m = moves[Math.floor(Math.random() * moves.length)]; // تلميح عشوائي بسيط
 const from = m.slice(0, 2);
 const to = m.slice(2, 4);
 const fromSq = squares.find(s => s.userData.square === from);
 const toSq = squares.find(s => s.userData.square === to);
 if(fromSq && toSq){
  fromSq.material.emissive.setHex(0xffd700);
  fromSq.material.emissiveIntensity = 2;
  toSq.material.emissive.setHex(0xffd700);
  toSq.material.emissiveIntensity = 2;
  setTimeout(() => { resetColors(); highlightLastMove(); highlightCheck(); }, 1500);
 }
};

function showWinModal(winner){
 gameOver = true;
 document.getElementById("winTitle").textContent = winner === "الأبيض" ? "🏆 فوز رائع!" : (winner === "الأسود" ? "💀 خسارة!" : "🤝 تعادل!");
 document.getElementById("winModal").style.display = "flex";
}

window.closeWinModal = function(playAgain){
 document.getElementById("winModal").style.display = "none";
 gameOver = false;
 if(playAgain) window.newGame(); else window.backMenu();
};

function onResize(){
 const w = holder.clientWidth;
 const h = holder.clientHeight;
 if(w === 0 || h === 0) return;
 camera.aspect = w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w, h);
 composer.setSize(w, h);
}

renderer.domElement.addEventListener("pointerdown", (e) => {
 const now = Date.now();
 if(!window.lastClick || now - window.lastClick < 400) return; // منع النقر المزدوج
 window.lastClick = now;
 onClick(e);
});

let clock = new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt = clock.getDelta();
 updateTweens(dt);

 // إضاءة متحركة
 const time = clock.getElapsedTime();
 energyLight1.position.x = Math.cos(time) * 5;
 energyLight1.position.z = Math.sin(time) * 5;
 energyLight2.position.x = Math.cos(time + Math.PI) * 5;
 energyLight2.position.z = Math.sin(time + Math.PI) * 5;

 controls.update();
 // استخدام composer للرسم بدلاً من renderer المباشر للحصول على تأثير الـ Bloom
 composer.render();
}

window.addEventListener("resize", onResize);
animate();

</script>
