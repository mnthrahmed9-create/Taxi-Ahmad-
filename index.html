<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>عرض الوحش 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; }
        canvas { display: block; }
    </style>
</head>
<body>

    <!-- استدعاء مكتبة Three.js وملحقاتها -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. إعداد المشهد (Scene)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222); // لون الخلفية غامق

        // 2. إعداد الكاميرا (Camera)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10); // تحديد موقع الكاميرا

        // 3. إعداد العارض (Renderer)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // تشغيل الظلال
        document.body.appendChild(renderer.domElement);

        // 4. إضافة الإضاءة (Lighting)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // إضاءة عامة
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2); // إضاءة موجهة للظل
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // 5. التحكم بالكاميرا (تدوير، تكبير، تحريك)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // حركة سلسة

        // 6. تحميل مجسم الوحش (ملف GLB)
        const loader = new GLTFLoader();
        // ضع اسم ملف الوحش هنا (يجب أن يكون في نفس المجلد)
        loader.load('monster.glb', function (gltf) {
            const model = gltf.scene;
            
            // تصغير أو تكبير الوحش ليناسب الشاشة (عدل الرقم حسب الحاجة)
            model.scale.set(1, 1, 1); 
            
            // تفعيل الظلال
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            scene.add(model);
        }, undefined, function (error) {
            console.error('حدث خطأ في تحميل الملف:', error);
        });

        // 7. حركة الكاميرا (تحديث مستمر)
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // تحديث التحكم
            renderer.render(scene, camera);
        }
        
        animate();

        // تعديل حجم الشاشة تلقائياً
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
